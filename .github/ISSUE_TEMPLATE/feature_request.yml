name: Feature request / 功能建议
description: Suggest a focused improvement to CTools.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or risk should CTools improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and recovery considerations
      description: Explain effects on config, credentials, Keychain, process control, or rollback.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include credentials, private endpoints, account data, or personal paths.
          required: true
